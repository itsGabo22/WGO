<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'surface-container': '#eeeeee', 'secondary-container': '#00d2fd', 'primary': '#003ec7', 'surface': '#ffffff', 'on-surface': '#000000', 'secondary': '#00677e', 'on-secondary-fixed': '#001f27', 'secondary-fixed-dim': '#3cd7ff', 'error': '#ba1a1a', 'on-primary': '#ffffff', 'error-container': '#ffdad6', 'on-primary-fixed': '#001452', 'surface-dim': '#dadada', 'on-error': '#ffffff', 'tertiary-container': '#bf3003', 'surface-container-low': '#f3f3f3', 'outline-variant': '#c3c5d9', 'secondary-fixed': '#b4ebff', 'tertiary-fixed-dim': '#ffb4a1', 'on-tertiary': '#ffffff', 'surface-container-high': '#e8e8e8', 'surface-container-lowest': '#ffffff', 'on-secondary-container': '#005669', 'surface-variant': '#e2e2e2', 'on-error-container': '#93000a', 'on-secondary': '#ffffff', 'on-surface-variant': '#434656', 'surface-container-highest': '#e2e2e2', 'background': '#ffffff', 'primary-fixed': '#dde1ff', 'primary-container': '#0052ff', 'on-primary-fixed-variant': '#0038b6', 'surface-tint': '#004ced', 'inverse-surface': '#303030', 'on-tertiary-container': '#ffddd5', 'inverse-primary': '#b7c4ff', 'on-secondary-fixed-variant': '#004e5f', 'on-background': '#000000', 'primary-fixed-dim': '#b7c4ff', 'on-tertiary-fixed-variant': '#891e00', 'inverse-on-surface': '#f1f1f1', 'on-primary-container': '#dfe3ff', 'outline': '#737688', 'surface-bright': '#ffffff', 'on-tertiary-fixed': '#3c0800', 'tertiary': '#952200', 'tertiary-fixed': '#ffdbd2' }, borderRadius: { DEFAULT: '1rem', lg: '2rem', xl: '3rem', full: '9999px' }, spacing: { 'space-xl': '1.5rem', 'gutter': '0.5rem', 'space-sm': '0.5rem', 'space-lg': '1rem', 'margin': '1rem', 'space-xs': '0.25rem', 'space-md': '0.75rem' }, fontFamily: { 'label-lg': ['Space Grotesk'], 'body-lg': ['Space Grotesk'], 'label-md': ['Space Grotesk'], 'body-md': ['Space Grotesk'], 'headline-lg': ['Space Grotesk'], 'headline-md': ['Space Grotesk'], 'label-sm': ['Space Grotesk'], 'headline-sm': ['Space Grotesk'] }, fontSize: { 'label-lg': ['13px', { lineHeight: '16px', letterSpacing: '0.04em', fontWeight: '700' }], 'body-lg': ['16px', { lineHeight: '20px', letterSpacing: '0em', fontWeight: '500' }], 'label-md': ['11px', { lineHeight: '14px', letterSpacing: '0.08em', fontWeight: '700' }], 'body-md': ['14px', { lineHeight: '18px', letterSpacing: '0em', fontWeight: '500' }], 'headline-lg': ['26px', { lineHeight: '30px', letterSpacing: '-0.03em', fontWeight: '700' }], 'headline-md': ['20px', { lineHeight: '24px', letterSpacing: '-0.02em', fontWeight: '700' }], 'label-sm': ['9px', { lineHeight: '12px', letterSpacing: '0.12em', fontWeight: '700' }], 'headline-sm': ['17px', { lineHeight: '20px', letterSpacing: '-0.01em', fontWeight: '600' }] } } } };</script><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;font-family:'Space Grotesk',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-[#121212] min-h-screen w-full flex items-center justify-center p-space-sm font-['Space_Grotesk']"><!-- Wearable Switcher & Responsive Canvas Container -->
<div class="min-h-screen w-full bg-[#121212] flex flex-col items-center justify-center p-4 selection:bg-primary-container selection:text-white">
<!-- Form Factor Interactive Switcher Bar -->
<header class="mb-5 z-30 flex items-center gap-1.5 bg-[#222222]/90 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 shadow-xl">
<span class="text-[10px] font-bold tracking-widest text-neutral-400 uppercase pl-1 pr-1.5">Formato:</span>
<button class="ff-btn px-3 py-1.5 rounded-full text-[11px] font-bold tracking-wider transition-all duration-200 bg-primary-container text-white shadow-md flex items-center gap-1.5" id="btn-compact" onclick="setFormFactor('compact')">
<span class="material-symbols-outlined text-[15px]">watch</span>
<span>Compacto 40mm</span>
</button>
<button class="ff-btn px-3 py-1.5 rounded-full text-[11px] font-bold tracking-wider transition-all duration-200 text-neutral-300 hover:text-white hover:bg-white/10 flex items-center gap-1.5" id="btn-large" onclick="setFormFactor('large')">
<span class="material-symbols-outlined text-[15px]">radio_button_checked</span>
<span>Grande 46mm</span>
</button>
<button class="ff-btn px-3 py-1.5 rounded-full text-[11px] font-bold tracking-wider transition-all duration-200 text-neutral-300 hover:text-white hover:bg-white/10 flex items-center gap-1.5" id="btn-rect" onclick="setFormFactor('rect')">
<span class="material-symbols-outlined text-[15px]">smartphone</span>
<span>Rectangular</span>
</button>
</header>
<!-- Device Hardware Bezel Wrapper -->
<div class="relative transition-all duration-300 ease-out bg-[#000000] shadow-[0_30px_70px_rgba(0,0,0,0.9)] border-[10px] border-[#222224] flex items-center justify-center w-[360px] h-[360px] rounded-full p-2" id="device-chassis">
<!-- Digital Screen Glass: Light Theme (#FFFFFF) with Zero-Clipping Safe Area Layout -->
<div class="relative w-full h-full bg-[#ffffff] text-[#000000] overflow-hidden flex flex-col items-center justify-between transition-all duration-300 rounded-full select-none" id="screen-glass">
<!-- TOP SAFE ZONE: Strictly calibrated inside top circular curve -->
<header class="w-full flex flex-col items-center pt-8 px-6 text-center z-10 transition-all duration-300 pointer-events-none" id="top-zone">
<h1 class="font-['Space_Grotesk'] text-[20px] leading-[24px] font-bold tracking-tight text-[#000000]" id="title-text">
          ¿A dónde vamos?
        </h1>
</header>
<!-- CENTER SAFE ZONE: Perfectly Centered Dominant Mic Button with Concentric Listening Rings -->
<div class="relative flex items-center justify-center my-auto transition-all duration-300 w-32 h-32" id="mic-zone">
<!-- Concentric Listening Ring (Subtle Pulsating Halo) -->
<div class="absolute inset-[-14px] rounded-full bg-[#0052ff]/12 animate-ping pointer-events-none duration-1000"></div>
<div class="absolute inset-[-6px] rounded-full bg-[#0052ff]/15 animate-pulse pointer-events-none"></div>
<!-- Primary Mic Button (>= 48dp Touch Target, High-Contrast Black/White with Active Accent) -->
<button aria-label="Escuchando destino" class="relative z-10 w-[78px] h-[78px] rounded-full bg-[#000000] text-white flex items-center justify-center shadow-lg active:scale-95 transition-transform duration-150 cursor-pointer focus:outline-none" id="mic-trigger">
<span class="material-symbols-outlined text-[36px] leading-none text-white" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- BOTTOM SAFE ZONE: High-contrast Cancel Button safely inside lower circular arc -->
<footer class="w-full flex justify-center pb-8 px-8 z-10 transition-all duration-300" id="bottom-zone">
<button aria-label="Cancelar búsqueda" class="w-full max-w-[176px] h-[48px] rounded-full bg-[#eeeeee] hover:bg-[#e4e4e4] active:bg-[#000000] active:text-[#ffffff] text-[#000000] flex items-center justify-center gap-1.5 transition-colors duration-150 shadow-sm border border-neutral-200/50" id="cancel-trigger">
<span class="material-symbols-outlined text-[17px] font-bold">close</span>
<span class="font-['Space_Grotesk'] text-[12px] font-bold tracking-wider uppercase">CANCELAR</span>
</button>
</footer>
</div>
</div>
<!-- Helper Note on Live Previews -->
<p class="mt-4 text-[11px] font-medium text-neutral-400 font-['Space_Grotesk'] tracking-wide text-center">
    Calibración auditada: radio safe-area anti-recorte y visualización directa en &lt; 1 segundo.
  </p>
</div>
<script>
  function setFormFactor(mode) {
    const chassis = document.getElementById('device-chassis');
    const glass = document.getElementById('screen-glass');
    const topZone = document.getElementById('top-zone');
    const bottomZone = document.getElementById('bottom-zone');
    const micZone = document.getElementById('mic-zone');
    const titleText = document.getElementById('title-text');
    const cancelBtn = document.getElementById('cancel-trigger');
    const micTrigger = document.getElementById('mic-trigger');
    
    // Switcher active styling reset
    const buttons = { compact: 'btn-compact', large: 'btn-large', rect: 'btn-rect' };
    Object.keys(buttons).forEach(k => {
      const btn = document.getElementById(buttons[k]);
      if (k === mode) {
        btn.className = 'ff-btn px-3 py-1.5 rounded-full text-[11px] font-bold tracking-wider transition-all duration-200 bg-primary-container text-white shadow-md flex items-center gap-1.5';
      } else {
        btn.className = 'ff-btn px-3 py-1.5 rounded-full text-[11px] font-bold tracking-wider transition-all duration-200 text-neutral-300 hover:text-white hover:bg-white/10 flex items-center gap-1.5';
      }
    });

    if (mode === 'compact') {
      chassis.style.width = '350px';
      chassis.style.height = '350px';
      chassis.style.borderRadius = '9999px';
      glass.style.borderRadius = '9999px';
      topZone.className = 'w-full flex flex-col items-center pt-8 px-6 text-center z-10 transition-all duration-300 pointer-events-none';
      bottomZone.className = 'w-full flex justify-center pb-8 px-8 z-10 transition-all duration-300';
      micZone.className = 'relative flex items-center justify-center my-auto transition-all duration-300 w-32 h-32';
      micTrigger.className = 'relative z-10 w-[78px] h-[78px] rounded-full bg-[#000000] text-white flex items-center justify-center shadow-lg active:scale-95 transition-transform duration-150 cursor-pointer focus:outline-none';
      titleText.className = 'font-[\'Space_Grotesk\'] text-[20px] leading-[24px] font-bold tracking-tight text-[#000000]';
      cancelBtn.className = 'w-full max-w-[176px] h-[48px] rounded-full bg-[#eeeeee] hover:bg-[#e4e4e4] active:bg-[#000000] active:text-[#ffffff] text-[#000000] flex items-center justify-center gap-1.5 transition-colors duration-150 shadow-sm border border-neutral-200/50';
    } else if (mode === 'large') {
      chassis.style.width = '420px';
      chassis.style.height = '420px';
      chassis.style.borderRadius = '9999px';
      glass.style.borderRadius = '9999px';
      topZone.className = 'w-full flex flex-col items-center pt-10 px-8 text-center z-10 transition-all duration-300 pointer-events-none';
      bottomZone.className = 'w-full flex justify-center pb-10 px-10 z-10 transition-all duration-300';
      micZone.className = 'relative flex items-center justify-center my-auto transition-all duration-300 w-40 h-40';
      micTrigger.className = 'relative z-10 w-[88px] h-[88px] rounded-full bg-[#000000] text-white flex items-center justify-center shadow-lg active:scale-95 transition-transform duration-150 cursor-pointer focus:outline-none';
      titleText.className = 'font-[\'Space_Grotesk\'] text-[23px] leading-[27px] font-bold tracking-tight text-[#000000]';
      cancelBtn.className = 'w-full max-w-[200px] h-[50px] rounded-full bg-[#eeeeee] hover:bg-[#e4e4e4] active:bg-[#000000] active:text-[#ffffff] text-[#000000] flex items-center justify-center gap-1.5 transition-colors duration-150 shadow-sm border border-neutral-200/50';
    } else if (mode === 'rect') {
      chassis.style.width = '330px';
      chassis.style.height = '450px';
      chassis.style.borderRadius = '3rem';
      glass.style.borderRadius = '2.6rem';
      topZone.className = 'w-full flex flex-col items-center pt-9 px-6 text-center z-10 transition-all duration-300 pointer-events-none';
      bottomZone.className = 'w-full flex justify-center pb-8 px-6 z-10 transition-all duration-300';
      micZone.className = 'relative flex items-center justify-center my-auto transition-all duration-300 w-36 h-36';
      micTrigger.className = 'relative z-10 w-[84px] h-[84px] rounded-full bg-[#000000] text-white flex items-center justify-center shadow-lg active:scale-95 transition-transform duration-150 cursor-pointer focus:outline-none';
      titleText.className = 'font-[\'Space_Grotesk\'] text-[22px] leading-[26px] font-bold tracking-tight text-[#000000]';
      cancelBtn.className = 'w-full max-w-[210px] h-[48px] rounded-full bg-[#eeeeee] hover:bg-[#e4e4e4] active:bg-[#000000] active:text-[#ffffff] text-[#000000] flex items-center justify-center gap-1.5 transition-colors duration-150 shadow-sm border border-neutral-200/50';
    }
  }
</script></body></html>
